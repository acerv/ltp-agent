#
# Self-CI for the ltp-agent repository: format check (ruff format),
# lint (ruff check), and unit tests (pytest) for the linter package.

name: "ltp-agent self-CI"

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linter:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: ruff format --check
        run: ruff format --check tools/linter/

      - name: ruff check
        run: ruff check tools/linter/

      - name: pytest
        run: python -m pytest tools/linter/tests/ -v
